<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アップロードサーバー</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f5f5f5; color: #222; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.4rem; }
  #drop { border: 2px dashed #888; border-radius: 12px; padding: 32px 16px; text-align: center; background: #fff; }
  #drop.over { border-color: #1565c0; background: #e3f2fd; }
  button { margin-top: 12px; padding: 10px 20px; font-size: 1rem; }
  ul { list-style: none; padding: 0; }
  li { background: #fff; margin: 6px 0; padding: 8px 12px; border-radius: 8px; word-break: break-all; white-space: pre-line; }
  .ok { color: #2e7d32; }
  .ng { color: #c62828; }
  #summary { margin: 16px 0 0; font-weight: bold; }
  #summary:empty { display: none; }
  .name { font-weight: bold; }
  .status { font-size: 0.9rem; color: #555; }
  progress { display: block; width: 100%; height: 8px; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>写真・動画のアップロード</h1>
  <div id="drop">
    <p>ここにファイルをドラッグ&amp;ドロップ<br>または</p>
    <input type="file" id="files" multiple accept="image/*,video/*">
    <br>
    <button id="send" disabled>アップロード</button>
  </div>
  <p id="summary"></p>
  <ul id="results"></ul>
</main>
<script>
  const input = document.getElementById('files');
  const drop = document.getElementById('drop');
  const send = document.getElementById('send');
  const results = document.getElementById('results');
  let pending = [];

  function setFiles(list) {
    pending = Array.from(list);
    send.disabled = pending.length === 0;
    send.textContent = pending.length ? `アップロード(${pending.length}件)` : 'アップロード';
  }

  input.addEventListener('change', () => setFiles(input.files));
  ['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => {
    e.preventDefault(); drop.classList.add('over');
  }));
  ['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => {
    e.preventDefault(); drop.classList.remove('over');
  }));
  drop.addEventListener('drop', e => setFiles(e.dataTransfer.files));

  const summary = document.getElementById('summary');

  // 送信待ちを含む一連のアップロード全体の集計(キューが空になったら次回リセット)
  const queue = [];
  let running = false;
  let total = { files: 0, bytes: 0, done: 0, doneBytes: 0, currentBytes: 0 };

  function formatBytes(n) {
    if (n < 1024) return `${n} B`;
    const units = ['KB', 'MB', 'GB'];
    let v = n / 1024, i = 0;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return `${v.toFixed(1)} ${units[i]}`;
  }

  function updateSummary() {
    const sent = Math.min(total.bytes, total.doneBytes + total.currentBytes);
    summary.textContent = running
      ? `${total.done} / ${total.files}件 · ${formatBytes(sent)} / ${formatBytes(total.bytes)}`
      : `完了: ${total.done} / ${total.files}件`;
  }

  // ファイルごとの表示行(名前・状態・進捗バー)を作る
  function createItem(file) {
    const li = document.createElement('li');
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = file.name;
    const status = document.createElement('div');
    status.className = 'status';
    status.textContent = `待機中(${formatBytes(file.size)})`;
    const bar = document.createElement('progress');
    bar.max = 1;
    bar.value = 0;
    li.append(name, status, bar);
    return { li, status, bar };
  }

  function finishItem(item, text, ok) {
    item.bar.remove();
    item.status.textContent = text;
    item.status.className = 'status ' + (ok ? 'ok' : 'ng');
  }

  // fetch では送信の進捗を取れないため XMLHttpRequest で送る
  function sendFile(file, onProgress, onSent) {
    return new Promise(resolve => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/upload');
      xhr.upload.onprogress = e => onProgress(e.lengthComputable ? e.loaded / e.total : null);
      xhr.upload.onload = onSent;
      xhr.onload = () => resolve({ status: xhr.status, text: xhr.responseText });
      xhr.onerror = () => resolve(null);
      const form = new FormData();
      form.append('file', file, file.name);
      xhr.send(form);
    });
  }

  async function upload(file, item) {
    const started = performance.now();
    item.status.textContent = '送信中 0%';
    const res = await sendFile(file, ratio => {
      if (ratio === null) {
        item.bar.removeAttribute('value');
        item.status.textContent = '送信中';
        return;
      }
      // 進捗はマルチパートの区切りを含む全体に対する割合なので、ファイルサイズに換算して表示する
      const sent = Math.round(file.size * ratio);
      const seconds = (performance.now() - started) / 1000;
      const speed = seconds > 0 ? ` · ${formatBytes(Math.round(sent / seconds))}/s` : '';
      item.bar.value = ratio;
      item.status.textContent =
        `送信中 ${Math.floor(ratio * 100)}%(${formatBytes(sent)} / ${formatBytes(file.size)})${speed}`;
      total.currentBytes = sent;
      updateSummary();
    }, () => {
      // 送信し終えてからサーバーの応答(保存完了)までの間
      item.bar.removeAttribute('value');
      item.status.textContent = '保存処理中…';
    });
    if (res === null) {
      finishItem(item, '失敗(通信エラー)', false);
    } else {
      const ok = res.status >= 200 && res.status < 300;
      // 成功時・スキップ時(415)はサーバーの結果(実際に保存した名前など)をそのまま表示する
      finishItem(item, ok || res.status === 415 ? res.text : `失敗(${res.text})`, ok);
    }
  }

  // 1ファイルずつ順に送信する(1リクエストあたりのサイズを抑える)
  async function runQueue() {
    running = true;
    while (queue.length) {
      const { file, item } = queue.shift();
      total.currentBytes = 0;
      updateSummary();
      await upload(file, item);
      total.done++;
      total.doneBytes += file.size;
      total.currentBytes = 0;
    }
    running = false;
    updateSummary();
  }

  send.addEventListener('click', () => {
    const files = pending;
    setFiles([]);
    input.value = '';
    if (!running) total = { files: 0, bytes: 0, done: 0, doneBytes: 0, currentBytes: 0 };
    // 選んだ順に上から並べる(新しい選択ほど上に表示する)
    const fragment = document.createDocumentFragment();
    for (const file of files) {
      const item = createItem(file);
      fragment.append(item.li);
      queue.push({ file, item });
      total.files++;
      total.bytes += file.size;
    }
    results.prepend(fragment);
    if (running) updateSummary(); else runQueue();
  });
</script>
</body>
</html>
